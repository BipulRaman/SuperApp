name: Build & Release APK

# Pipeline:
#   • push to main touching app/**  → auto-bumps patch version, builds & signs APK,
#                                     creates a tag (v1.0.0, v1.0.1, …) and publishes a GitHub Release.
#   • workflow_dispatch              → same flow, run on demand.
#
# Requires repo secret: DEBUG_KEYSTORE_BASE64 (see .github/workflows/setup-keystore.yml).

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed to push the tag and publish the GitHub Release

defaults:
  run:
    working-directory: app

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history + tags to compute next version

      - name: Compute next version
        id: version
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          # Find the highest existing tag of the form vMAJOR.MINOR.PATCH.
          # If none exist, start at v1.0.0; otherwise bump the patch.
          git fetch --tags --force --quiet
          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
                      | sort -V | tail -n 1)
          if [ -z "${LAST_TAG}" ]; then
            NEXT="1.0.0"
          else
            IFS='.' read -r MA MI PA <<< "${LAST_TAG#v}"
            PA=$((PA + 1))
            NEXT="${MA}.${MI}.${PA}"
          fi
          echo "Last tag: ${LAST_TAG:-<none>} → next version: v${NEXT}"
          echo "name=${NEXT}"      >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}"      >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/android/.gradle
          # app/android/ doesn't exist until `expo prebuild` runs, so we can't
          # hash gradle files at this step. Hash app/package.json instead so
          # the cache invalidates when Expo SDK / native deps change (which is
          # what regenerates the gradle files anyway).
          key: ${{ runner.os }}-gradle-${{ hashFiles('app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Apply version to app.json
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          # Pass values via env vars to node so they're never string-interpolated
          # into the JS source (safer with arbitrary content).
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            cfg.expo.version = process.env.VERSION_NAME;
            cfg.expo.android = cfg.expo.android || {};
            cfg.expo.android.versionCode = parseInt(process.env.VERSION_CODE, 10);
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2) + "\n");
          '
          echo "Set expo.version=${VERSION_NAME}, expo.android.versionCode=${VERSION_CODE}"

      - name: Expo prebuild (generate android/ folder)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Install stable debug keystore (for in-place APK upgrades)
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${DEBUG_KEYSTORE_BASE64}" ]; then
            echo "::error::Repository secret DEBUG_KEYSTORE_BASE64 is not set."
            echo "Run the 'Setup signing keystore (run once)' workflow, then copy the printed"
            echo "base64 value into Settings → Secrets and variables → Actions →"
            echo "New repository secret named 'DEBUG_KEYSTORE_BASE64'."
            echo "Without it, every CI build is signed with a different ephemeral key,"
            echo "and APKs cannot be installed over each other."
            exit 1
          fi
          # `expo prebuild` creates android/app/debug.keystore from a freshly-generated
          # ephemeral key. Replace it with the keystore decoded from our repo secret so
          # all builds share the same signature → users can install newer APKs over
          # older without uninstalling first.
          echo "${DEBUG_KEYSTORE_BASE64}" | base64 -d > android/app/debug.keystore
          if [ ! -s android/app/debug.keystore ]; then
            echo "::error::Decoded keystore is empty — DEBUG_KEYSTORE_BASE64 secret is malformed."
            exit 1
          fi
          echo "Installed stable debug keystore (sha256: $(sha256sum android/app/debug.keystore | cut -d' ' -f1))"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Ensure release variant is signed with our stable keystore
        shell: bash
        run: |
          # Expo prebuild's release buildType has no signingConfig by default
          # (it expects the user to wire one). Inject one that reuses the same
          # debug.keystore we installed above, so the release APK is signed
          # with the same stable key → users can upgrade in place.
          GRADLE_FILE=android/app/build.gradle
          # Check whether the `release { ... }` block already declares a signingConfig.
          if awk '/release[[:space:]]*{/,/^[[:space:]]*}/' "$GRADLE_FILE" | grep -q 'signingConfig'; then
            echo "release buildType already has signingConfig — leaving it alone"
          else
            # Insert `signingConfig signingConfigs.debug` as the first line of release { ... }
            sed -i '0,/release[[:space:]]*{/s||release {\n            signingConfig signingConfigs.debug|' "$GRADLE_FILE"
            echo "Patched release buildType to use signingConfigs.debug"
          fi
          echo "--- release block after patch ---"
          awk '/release[[:space:]]*{/,/^[[:space:]]*}/' "$GRADLE_FILE"

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK with versioned name
        id: stage
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::No release APK found under android/app/build/outputs/apk/release"
            find android/app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          NAME="SuperApp-${VERSION_TAG}.apk"
          mkdir -p dist
          cp "$SRC" "dist/${NAME}"
          echo "path=app/dist/${NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Built: app/dist/${NAME} (versionName=${{ steps.version.outputs.name }}, versionCode=${{ steps.version.outputs.code }})"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ${{ steps.stage.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create and push tag
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION_TAG}" -m "Release ${VERSION_TAG}"
          git push origin "${VERSION_TAG}"
          echo "Pushed tag ${VERSION_TAG}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.stage.outputs.path }}
