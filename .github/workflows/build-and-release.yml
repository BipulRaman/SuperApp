name: Build & Release APK

# Single pipeline:
#   • push to main / PR / manual run  → builds debug APK, uploads as artifact
#   • push a tag like v1.2.3          → also publishes a GitHub Release with the APK attached
#
# No secrets required. Uses the built-in GITHUB_TOKEN to publish releases.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release on tag push

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Expo prebuild (generate android/ folder)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK with versioned name
        id: stage
        run: |
          SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="SuperApp-${GITHUB_REF_NAME}.apk"
          else
            NAME="SuperApp-${GITHUB_SHA::7}.apk"
          fi
          mkdir -p dist
          cp "$SRC" "dist/${NAME}"
          echo "path=dist/${NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Built: dist/${NAME}"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ${{ steps.stage.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.stage.outputs.path }}
