name: Setup signing keystore (run once)

# Generates a stable Android debug keystore and commits it to the repo.
# Run this ONCE via Actions → "Setup signing keystore (run once)" → Run workflow.
# After it commits app/android-keystore/debug.keystore, every APK built by the
# main release pipeline is signed with the same key, so users can install a
# newer version over an older one without uninstalling first.
#
# Re-running this workflow OVERWRITES the keystore — only do that if you're
# OK with losing the ability to upgrade APKs already installed on devices.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite an existing keystore (DANGER: breaks in-place upgrades for already-installed APKs)"
        type: boolean
        default: false

permissions:
  contents: write   # to commit & push the generated keystore

jobs:
  generate:
    name: Generate & commit keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bail out if keystore already exists (unless forced)
        run: |
          if [ -f "app/android-keystore/debug.keystore" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "::error::app/android-keystore/debug.keystore already exists. Re-run with 'force = true' to overwrite (this will break in-place upgrades for already-installed APKs)."
            exit 1
          fi

      - name: Generate keystore
        run: |
          mkdir -p app/android-keystore
          # -storetype JKS matches the format Android Gradle Plugin and Expo prebuild use
          # for the default debug keystore, ensuring drop-in compatibility.
          keytool -genkeypair \
            -noprompt \
            -v \
            -keystore app/android-keystore/debug.keystore \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -dname "CN=SuperApp Debug,O=SuperApp,C=US"
          echo "Generated $(ls -l app/android-keystore/debug.keystore)"
          keytool -list -v -keystore app/android-keystore/debug.keystore -storepass android | head -n 20

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/android-keystore/debug.keystore
          if git diff --cached --quiet; then
            echo "Nothing to commit (keystore unchanged)."
            exit 0
          fi
          git commit -m "ci: generate stable Android debug keystore for in-place APK upgrades"
          # Rebase in case main moved while the workflow was running.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
