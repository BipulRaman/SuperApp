name: Setup signing keystore (run once)

# Generates a stable Android debug keystore and prints it (base64-encoded) to
# the workflow log so you can copy it into a repo Secret. Run this ONCE via
# Actions → "Setup signing keystore (run once)" → Run workflow.
#
# Output: a single value to put in a repo Secret named DEBUG_KEYSTORE_BASE64.
# Once that secret exists, every APK built by the release pipeline is signed
# with the same key, so users can install a newer version over an older one
# without uninstalling first.
#
# The keystore is NEVER committed to the repo — it lives only in the workflow
# log (auto-deleted after 90 days) and in your repo Secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate keystore + print setup instructions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          # -storetype JKS matches the format Android Gradle Plugin and Expo prebuild
          # use for the default debug keystore, ensuring drop-in compatibility.
          # Passwords are kept at the Android default ("android" / "androiddebugkey")
          # so no gradle signing config changes are needed in the build pipeline.
          keytool -genkeypair \
            -noprompt \
            -v \
            -keystore debug.keystore \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -dname "CN=SuperApp Debug,O=SuperApp,C=US"

      - name: Print setup instructions
        run: |
          BASE64=$(base64 -w 0 debug.keystore)
          SHA=$(sha256sum debug.keystore | cut -d' ' -f1)
          echo ""
          echo "================================================================"
          echo " Keystore generated successfully."
          echo " SHA-256: ${SHA}"
          echo "================================================================"
          echo ""
          echo " ACTION REQUIRED — create one repository secret:"
          echo ""
          echo "  1. Go to: Settings → Secrets and variables → Actions → New repository secret"
          echo "  2. Name:  DEBUG_KEYSTORE_BASE64"
          echo "  3. Value: copy the base64 block printed below (everything between"
          echo "           the BEGIN / END markers, no surrounding whitespace)"
          echo ""
          echo "----- BEGIN DEBUG_KEYSTORE_BASE64 -----"
          echo "${BASE64}"
          echo "----- END DEBUG_KEYSTORE_BASE64 -----"
          echo ""
          echo " Once the secret is set, push a tag (e.g. 'git tag v1.0.0 && git push origin v1.0.0')"
          echo " or re-run the failed build workflow. The APK will be signed with this keystore."
          echo ""
          echo " IMPORTANT — keep this keystore. If you regenerate it, all APKs already"
          echo " installed on devices must be UNINSTALLED before the next update will install."
          echo "================================================================"

      - name: Cleanup keystore from runner
        if: always()
        run: rm -f debug.keystore
